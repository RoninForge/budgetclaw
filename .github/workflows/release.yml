name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Install syft for SBOMs
        id: syft
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.57.0
      - name: Wait before retrying the syft download
        if: steps.syft.outcome == 'failure'
        run: sleep 30
      - name: Install syft for SBOMs (second attempt)
        if: steps.syft.outcome == 'failure'
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.57.0
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
