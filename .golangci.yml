# golangci-lint v2 config. Keep the linter set small but sharp:
# enabling everything generates noise that drowns real signal.
#
# Rationale for each enabled linter:
#   errcheck   - unchecked errors are the #1 Go bug source
#   govet      - stdlib-blessed static analysis
#   ineffassign - dead assignments
#   staticcheck - comprehensive correctness suite
#   unused     - dead code
#   gofmt      - non-negotiable formatting
#   goimports  - import hygiene
#   misspell   - catch documentation typos
#   gosec      - security-focused (we SIGTERM processes, this matters)
#   revive     - configurable, replaces golint
#   gocritic   - opinionated but catches real bugs
#   unconvert  - redundant type conversions
#   unparam    - unused function parameters
#   depguard   - confines net/http to the packages allowed to reach the
#                network, so "zero keys, zero prompts, zero latency added"
#                and offline-by-default cannot be broken by an import

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - revive
    - gocritic
    - unconvert
    - unparam
    - depguard

  settings:
    depguard:
      rules:
        # Network egress is a product promise, not an implementation
        # detail. Three packages are allowed to make requests, each for a
        # reason a user opted into:
        #
        #   pricing/refresh - the signed price table, off by default
        #   goei           - syncing to a dashboard the user configured
        #   ntfy           - push alerts to a server the user configured
        #
        # Everywhere else, an import of net/http is the beginning of a
        # version check, a telemetry ping, or an eager warm-up on a path
        # nobody consented to. The zero-egress canary tests catch one that
        # actually fires; this catches one before it is even wired up,
        # which is the cheaper place to catch it.
        network-egress:
          list-mode: lax
          files:
            - "!**/internal/pricing/refresh/**"
            - "!**/internal/goei/**"
            - "!**/internal/ntfy/**"
            # Tests legitimately need httptest to serve fixtures locally,
            # and the canaries need net/http to install a tripwire.
            - "!$test"
          deny:
            - pkg: net/http
              desc: "network egress is confined to internal/pricing/refresh, internal/goei and internal/ntfy; see the depguard rule in .golangci.yml"

    errcheck:
      exclude-functions:
        # CLI output to stdout/stderr. If the pipe is broken the
        # program is already dying; checking the error on every
        # Fprintf adds noise without recoverable value.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
    gosec:
      excludes:
        # G304: file inclusion via variable. We read files from paths
        # the user configured; this is by design, not a vuln.
        - G304

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - errcheck
